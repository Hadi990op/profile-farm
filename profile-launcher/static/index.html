<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Launcher</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,sans-serif; background:#0f1117; color:#e6e6e6; padding:24px; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:#888; font-size:13px; margin-bottom:24px; }
  .btn { background:#4f7cff; color:#fff; border:0; padding:10px 20px; border-radius:8px; cursor:pointer; font-size:14px; }
  .btn:hover { background:#3d6bf5; }
  .btn.ghost { background:transparent; border:1px solid #444; color:#aaa; }
  .btn.ghost:hover { border-color:#666; }
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .profiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:14px; }
  .card { background:#1a1d26; border:1px solid #2a2e3a; border-radius:12px; padding:16px; }
  .card h3 { font-size:16px; margin-bottom:4px; }
  .card .meta { color:#888; font-size:12px; margin-bottom:12px; }
  .card .actions { display:flex; gap:8px; }
  .empty { text-align:center; padding:60px 20px; color:#666; }
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10; }
  .modal-bg.show { display:flex; align-items:center; justify-content:center; }
  .modal { background:#1a1d26; padding:24px; border-radius:12px; width:380px; }
  .modal h2 { font-size:18px; margin-bottom:16px; }
  .modal label { display:block; font-size:12px; color:#999; margin:12px 0 4px; }
  .modal input, .modal select { width:100%; padding:10px; border-radius:6px; border:1px solid #333; background:#0f1117; color:#fff; font-size:14px; }
</style>
</head>
<body>
  <div class="toolbar">
    <div>
      <h1>Profile Launcher</h1>
      <div class="sub">Multi-identity browser profiles — each with a fixed country IP</div>
    </div>
    <button class="btn" onclick="showModal()">+ New Profile</button>
  </div>

  <div id="profiles" class="profiles"></div>
  <div id="empty" class="empty" style="display:none">No profiles yet — click "New Profile" to create one.</div>

  <div id="modal-bg" class="modal-bg">
    <div class="modal">
      <h2>New Profile</h2>
      <label>Name</label>
      <input id="f-name" placeholder="e.g. TikTok US #1">
      <label>Country</label>
      <select id="f-country">
        <option value="United States">🇺🇸 United States</option>
        <option value="United Kingdom">🇬🇧 United Kingdom</option>
        <option value="Germany">🇩🇪 Germany</option>
        <option value="France">🇫🇷 France</option>
        <option value="Pakistan">🇵🇰 Pakistan</option>
  </select>
      <label>City (optional)</label>
      <input id="f-city" placeholder="e.g. New York">
      <div style="margin-top:18px; display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn ghost" onclick="hideModal()">Cancel</button>
        <button class="btn" onclick="createProfile()">Create</button>
      </div>
    </div>
  </div>

<script>
let profiles = [];

async function refresh() {
  const res = await fetch('/api/profiles');
  profiles = await res.json();
  const el = document.getElementById('profiles');
  const container = Object.values(profiles);
  document.getElementById('empty').style.display = container.length ? 'none' : 'block';
  el.innerHTML = container.map(p => `
    <div class="card">
      <h3>${p.name}</h3>
      <div class="meta">${p.country || '—'} · ${p.running ? '🟢 running' : '⚪ stopped'}</div>
      <div class="actions">
        <button class="btn" onclick="launch('${p.id}')">Launch</button>
        <button class="btn ghost" onclick="delProfile('${p.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

function showModal() { document.getElementById('modal-bg').classList.add('show'); }
function hideModal() { document.getElementById('modal-bg').classList.remove('show'); }

async function createProfile() {
  const body = {
    name: document.getElementById('f-name').value,
    country: document.getElementById('f-country').value,
    city: document.getElementById('f-city').value,
  };
  await fetch('/api/profiles', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  hideModal();
  refresh();
}
async function launch(id) {
  await fetch(`/api/profiles/${id}/launch`, { method:'POST' });
  refresh();
}
async function delProfile(id) {
  await fetch(`/api/profiles/${id}/delete`, { method:'POST' });
  refresh();
}
refresh();
</script>
</body>
</html>
